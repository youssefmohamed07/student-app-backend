<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الثانوية العامة 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }
        .main-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .btn-custom {
            background-color: #1d4ed8;
            color: white;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #1e40af;
            color: white;
            transform: translateY(-1px);
        }
        .badge-custom {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 50px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .result-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
        }
        .error-box {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 16px;
            color: #991b1b;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                    <i class="fas fa-graduation-cap fa-lg"></i>
                </div>
                <span class="fw-bold fs-5">نتيجة الثانوية العامة</span>
            </div>
            <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2">
                <i class="fas fa-check-circle me-1"></i> النتيجة معتمدة 2026
            </span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex gap-2 mb-3">
                <span class="badge-custom"><i class="fas fa-globe me-1"></i> نتيجة جمهورية موحدة</span>
                <span class="badge-custom">العام الدراسي 2026</span>
            </div>
            <h1 class="fw-bold display-5 mb-3">استعلم فوراً عن نتيجتك برقم الجلوس أو الاسم</h1>
            <p class="text-muted fs-5">أدخل رقم الجلوس أو الاسم كاملاً لمعرفة تفاصيل المجموع والنسبة المئوية رسمياً.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="main-card p-4 p-md-5 mb-4">
                    <form id="searchForm" onsubmit="handleSearch(event)">
                        <div class="row g-2">
                            <div class="col-md-9">
                                <div class="position-relative">
                                    <input type="text" id="searchInput" class="form-control form-control-lg pe-5" placeholder="أدخل رقم الجلوس أو الاسم..." required style="border-radius: 12px; height: 54px;">
                                    <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <button type="submit" id="submitBtn" class="btn btn-custom w-100 h-100 d-flex align-items-center justify-content-center gap-2">
                                    <span>عرض النتيجة</span>
                                    <i class="fas fa-arrow-left"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div id="outputArea"></div>
            </div>
        </div>
    </div>

    <script>
        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            const output = document.getElementById('outputArea');
            const btn = document.getElementById('submitBtn');

            if (!query) return;

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> جاري البحث...`;
            output.innerHTML = '';

            const isNumber = /^\d+$/.test(query);
            const url = isNumber 
                ? `/api/result/${query}` 
                : `/api/search/name?name=${encodeURIComponent(query)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'حدث خطأ في جلب البيانات');
                }

                if (isNumber) {
                    renderSingleResult(data);
                } else {
                    renderMultipleResults(data);
                }
            } catch (err) {
                output.innerHTML = `
                    <div class="error-box p-4 text-center">
                        <i class="fas fa-exclamation-circle fa-2x mb-2 text-danger"></i>
                        <h5 class="fw-bold mb-1">لم نتمكن من إيجاد النتيجة</h5>
                        <p class="mb-0 text-muted">${err.message}</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>عرض النتيجة</span> <i class="fas fa-arrow-left"></i>`;
            }
        }

        function renderSingleResult(data) {
            document.getElementById('outputArea').innerHTML = `
                <div class="result-box p-4 text-center">
                    <h3 class="fw-bold text-success mb-2">${data.name}</h3>
                    <p class="text-muted mb-3">رقم الجلوس: <strong>${data.seating_no}</strong></p>
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="bg-white p-3 rounded-3 border">
                                <span class="d-block text-muted small">المجموع الكلي</span>
                                <span class="fs-3 fw-bold text-primary">${data.total_score}</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="bg-white p-3 rounded-3 border">
                                <span class="d-block text-muted small">النسبة المئوية</span>
                                <span class="fs-3 fw-bold text-success">${data.percentage}%</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMultipleResults(list) {
            let html = `<div class="bg-white rounded-4 border p-3"><h5 class="fw-bold mb-3 px-2">نتائج البحث (${list.length}):</h5><div class="list-group list-group-flush">`;
            list.forEach(item => {
                html += `
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div>
                            <h6 class="fw-bold mb-1">${item.name}</h6>
                            <small class="text-muted">رقم الجلوس: ${item.seating_no}</small>
                        </div>
                        <span class="badge bg-primary rounded-pill fs-6">${item.total_score} درجة</span>
                    </div>
                `;
            });
            html += `</div></div>`;
            document.getElementById('outputArea').innerHTML = html;
        }
    </script>
</body>
</html>
